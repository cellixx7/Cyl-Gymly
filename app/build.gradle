plugins { id 'com.android.application' }

android {
    namespace 'br.app.treinosaude'
    compileSdk 35
    defaultConfig {
        applicationId 'br.app.treinosaude'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.3.1'
    }
    signingConfigs {
        release {
            // Chave de assinatura: arquivo keystore.jks na pasta do projeto.
            // Use SEMPRE a mesma chave para atualizar o app sem perder dados.
            storeFile file('../keystore.jks')
            storePassword System.getenv('TS_KEY_PASS') ?: 'treinosaude'
            keyAlias 'treinosaude'
            keyPassword System.getenv('TS_KEY_PASS') ?: 'treinosaude'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
